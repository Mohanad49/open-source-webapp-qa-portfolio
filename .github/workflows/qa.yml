name: UI Automation Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly. A weekly cron produced about four runs a month, which is below the
    # five scored runs the rolling-flip classifier needs before it will call
    # anything flaky - so it never got to say anything.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_URL: https://the-internet.herokuapp.com
  BROWSER: chrome
  HEADLESS: true
  TIMEOUT: 15
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Selenium + PyTest regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java for Allure CLI
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Allure command line
        run: npm install -g allure-commandline

      - name: Run smoke suite on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest -m smoke --browser chrome \
            --html=reports/pytest-report.html --self-contained-html \
            --alluredir=reports/allure-results

      - name: Run full suite on main/manual/schedule
        if: github.event_name != 'pull_request'
        id: regression
        continue-on-error: true
        run: |
          python -m pytest --browser chrome \
            --html=reports/pytest-report.html --self-contained-html \
            --alluredir=reports/allure-results \
            --junitxml=reports/junit-results.xml

      - name: Generate Allure static report
        if: always()
        run: |
          mkdir -p public
          cp -R report-hub/* public/
          if [ -d reports/allure-results ]; then
            allure generate reports/allure-results --clean -o public/allure-report
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            reports/
            public/

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy report hub to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && always()
        uses: actions/deploy-pages@v4

      - name: Fail workflow when regression failed
        if: steps.regression.outcome == 'failure'
        run: exit 1

  # Repeat runs of one unchanged commit, on a schedule only.
  #
  # The suite runs against a live third-party demo site, which is exactly the
  # environment where genuine flakiness lives: network timing, shared state, and
  # a target nobody here controls. Three runs of one SHA are what distinguishes
  # "the site was slow" from "this test is wrong".
  #
  # Separate job, because the main one deploys to Pages and parallel copies would
  # race on that.
  repeat:
    name: Repeat run ${{ matrix.attempt }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A failing run is the data being collected.
      - name: Run full suite
        continue-on-error: true
        run: |
          python -m pytest --browser chrome \
            --alluredir=reports/allure-results \
            --junitxml=reports/junit-results.xml

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-attempt-${{ matrix.attempt }}
          path: |
            reports/junit-results.xml
            reports/allure-results/
          retention-days: 30
